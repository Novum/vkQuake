// Loot mod key binds. Quake runs this file when the mod starts.
// Change the keys here if you prefer others.

bind 1 "impulse 1"      // gun slot 1
bind 2 "impulse 2"      // gun slot 2
bind 3 "impulse 3"      // gun slot 3
bind 4 "impulse 4"      // gun slot 4
bind 5 "impulse 5"      // axe

bind r "impulse 13"     // reload
bind e "impulse 14"     // swap your gun with the one on the floor
bind g "impulse 15"     // drop your gun

bind MWHEELDOWN "impulse 10"   // next gun
bind MWHEELUP   "impulse 12"   // previous gun
